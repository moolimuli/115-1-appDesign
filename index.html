<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #090d16;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景流動光暈球 */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      pointer-events: none;
      animation: float 14s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      top: 15%;
      left: 20%;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ec4899 0%, rgba(236, 72, 153, 0) 70%);
      bottom: 15%;
      right: 20%;
      animation-delay: -7s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s infinite ease-in-out alternate;
    }

    /* 細微網格背景 */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      pointer-events: none;
    }

    /* 玻璃擬態卡片容器 */
    .card {
      position: relative;
      padding: 3.5rem 5rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: default;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(99, 102, 241, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* 漸層發光文字 */
    h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: capitalize;
      background: linear-gradient(135deg, #ffffff 10%, #d1d5db 40%, #a5b4fc 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 20px rgba(255, 255, 255, 0.2));
      transition: filter 0.3s ease;
    }

    .card:hover h1 {
      filter: drop-shadow(0 4px 28px rgba(165, 180, 252, 0.5));
    }

    /* 動畫設定 */
    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, -30px) scale(1.1);
      }
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.3;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.6;
      }
    }

    @media (max-width: 640px) {
      .card {
        padding: 2.5rem 3rem;
        border-radius: 20px;
        margin: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>

  <div class="card">
    <h1>Hello World</h1>
  </div>
</body>
</html>
